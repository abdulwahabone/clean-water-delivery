# .github/workflows/impeccable-preview.yml
# Runs the app in YOUR CI (your dependencies, env, seeded data) and tunnels it
# to Impeccable for the minutes the design review takes; then the job exits and
# the tunnel closes. Nothing to provision: the job's GitHub OIDC token proves
# the repo and commit, and the tunnel needs no account. When a step fails,
# the last step tells Impeccable which one, so the setup page can say.
name: impeccable preview
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        id: setup
      - uses: actions/setup-node@v4
        id: setup-2
        with: { node-version: 'lts/*', cache: pnpm }
      - id: install
        shell: bash
        run: |
          exec > >(tee impeccable-step.log) 2>&1
          pnpm install --frozen-lockfile
      - name: Prepare
        id: prepare
        shell: bash
        run: |
          exec > >(tee impeccable-step.log) 2>&1
          mkdir -p data && pnpm db:push
      - id: build
        shell: bash
        run: |
          exec > >(tee impeccable-step.log) 2>&1
          pnpm build
      - name: Seed data
        id: seed
        shell: bash
        run: |
          exec > >(tee impeccable-step.log) 2>&1
          pnpm db:seed
      - name: Start the app
        id: start
        run: |
          (pnpm start > app.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf "http://localhost:3000/" >/dev/null && break; sleep 2; done
          curl -sf "http://localhost:3000/" >/dev/null || { echo "the app did not answer on http://localhost:3000/ within two minutes"; tail -c 3000 app.log; exit 1; }
      - name: Tunnel to Impeccable and wait for the review
        id: tunnel
        run: |
          curl -sSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared && chmod +x cloudflared
          ./cloudflared tunnel --url "http://localhost:3000" --no-autoupdate > tunnel.log 2>&1 &
          for i in $(seq 1 30); do URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1); [ -n "$URL" ] && break; sleep 2; done
          test -n "$URL" || { echo "no tunnel URL"; cat tunnel.log; exit 1; }
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=impeccable.reviews" | jq -r .value)
          REG=$(curl -sS --fail-with-body -X POST https://impeccable.reviews/api/tunnels \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"url\": \"$URL\"}")
          echo "$REG"
          POLL=$(echo "$REG" | jq -r .poll)
          POLLED="$REG"
          WAIT=2
          for i in $(seq 1 8); do
            NEXT=$(curl -sS "https://impeccable.reviews$POLL" || true)
            if echo "$NEXT" | jq -e '.access' >/dev/null 2>&1; then POLLED="$NEXT"; fi
            [ "$(echo "$POLLED" | jq -r '.access.access // "unknown"')" = "unreachable" ] || break
            sleep $WAIT; WAIT=$(( WAIT * 2 > 20 ? 20 : WAIT * 2 ))
          done
          echo "impeccable access check: $(echo "$POLLED" | jq -r '.access.detail // "not run"')"
          for i in $(seq 1 120); do
            STATE=$(curl -sS "https://impeccable.reviews$POLL" | jq -r .state)
            [ "$STATE" = "done" ] && break
            sleep 10
          done
          echo "review done; closing the tunnel"
      - name: Tell Impeccable what failed
        if: failure()
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=impeccable.reviews" | jq -r .value)
          LOG=$({ for f in impeccable-step.log app.log tunnel.log; do [ -s "$f" ] && { echo "== $f"; tail -c 3000 "$f"; }; done; true; } | sed -E 's#://([^:/@[:space:]]+):[^@[:space:]]+@#://\1:***@#g')
          jq -n --arg log "$LOG" --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{"outcomes": {"setup": "${{ steps.setup.outcome }}", "setup-2": "${{ steps.setup-2.outcome }}", "install": "${{ steps.install.outcome }}", "prepare": "${{ steps.prepare.outcome }}", "build": "${{ steps.build.outcome }}", "seed": "${{ steps.seed.outcome }}", "start": "${{ steps.start.outcome }}", "tunnel": "${{ steps.tunnel.outcome }}"}, "log": $log, "runUrl": $url}' \
            | curl -sS -X POST https://impeccable.reviews/api/previews/report \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @-
